<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fenix Ninja — lienzo de partículas con consola de comandos.">
    <title>Fenix Ninja</title>
    <link rel="icon" type="image/png" href="src/logo_unicorn-bg.png">

    <!-- Design tokens: fuente canónica de color, radio, espaciado y movimiento -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/console.css">

    <!-- PIXI.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.3/pixi.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/ethnocentric" rel="stylesheet">
</head>
<body>
    <!-- Iconografía propia: vectorial SVG, sin emojis del sistema operativo -->
    <svg class="fnx-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="icon-terminal" viewBox="0 0 24 24">
            <rect x="2.75" y="4" width="18.5" height="16" rx="2.5"></rect>
            <path d="m7 9.5 3 3-3 3"></path>
            <path d="M12.5 15.5h4.5"></path>
        </symbol>
        <symbol id="icon-upload" viewBox="0 0 24 24">
            <path d="M12 15.5V4.5"></path>
            <path d="m8 8.5 4-4 4 4"></path>
            <path d="M4.75 15v3.25a1.5 1.5 0 0 0 1.5 1.5h11.5a1.5 1.5 0 0 0 1.5-1.5V15"></path>
        </symbol>
    </svg>

    <div class="ai-canvas-wrapper">
        <div id="ai-canvas-container" data-will-read-frequently="true"></div>
    </div>

    <!-- Consola de comandos -->
    <div class="fnx-console" id="fnx-console" data-open="false">
        <div class="fnx-console__panel" id="fnx-console-panel">
            <div class="fnx-console__head">
                <span class="fnx-console__title">Consola</span>
                <span class="fnx-console__count" id="fnx-console-count"></span>
            </div>

            <figure class="fnx-console__media" id="fnx-console-media" hidden>
                <img
                    class="fnx-console__image"
                    id="fnx-console-image"
                    alt=""
                    crossorigin="anonymous"
                    decoding="async"
                >
                <span class="fnx-console__media-wipe" aria-hidden="true"></span>
            </figure>

            <div class="fnx-console__output" id="fnx-console-output" role="log" aria-live="polite"></div>

            <ul
                class="fnx-console__list"
                id="fnx-command-list"
                role="listbox"
                aria-label="Comandos disponibles"
                hidden
            ></ul>

            <div class="fnx-console__field">
                <svg class="fnx-icon" aria-hidden="true"><use href="#icon-terminal"></use></svg>
                <input
                    type="text"
                    id="ai-input"
                    class="fnx-console__input"
                    placeholder="Escribe un comando… p. ej. /cv"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="fnx-command-list"
                    aria-autocomplete="list"
                    aria-describedby="fnx-console-hint"
                    aria-label="Entrada de comandos"
                >
                <button
                    type="button"
                    class="fnx-console__upload"
                    id="fnx-upload-button"
                    aria-label="Subir imagen"
                    title="Subir imagen"
                >
                    <svg class="fnx-icon" aria-hidden="true"><use href="#icon-upload"></use></svg>
                </button>
            </div>

            <p class="fnx-console__hint" id="fnx-console-hint">
                <span><kbd>Enter</kbd> ejecutar</span>
                <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
                <span><kbd>Tab</kbd> completar</span>
                <span><kbd>`</kbd> ocultar</span>
            </p>
        </div>

        <button
            type="button"
            class="fnx-console__toggle"
            id="fnx-console-toggle"
            aria-expanded="true"
            aria-controls="fnx-console-panel"
            aria-label="Ocultar la consola de comandos"
            title="Mostrar u ocultar la consola"
        >
            <svg class="fnx-icon" aria-hidden="true"><use href="#icon-terminal"></use></svg>
        </button>

        <input type="file" id="ai-upload" class="fnx-console__file" accept="image/*">
    </div>

    <!-- Scripts -->
    <script src="js/ai-canvas.js"></script>
    <script src="js/typewriter.js"></script>
    <script src="js/presenter.js"></script>
    <script src="js/content.js"></script>
    <script src="js/console.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.AICanvas && typeof AICanvas.init === 'function') {
                // Inicializar AICanvas
                AICanvas.init(); // Esto también llama a elder() con la imagen base64 por defecto

                // Esperar un momento para asegurar que AICanvas y sus listeners estén listos
                setTimeout(() => {
                    const imageUrl = 'src/logo_unicorn-bg.png';
                    const uploadInput = document.getElementById('ai-upload');

                    if (!uploadInput) {
                        console.error('Elemento de subida #ai-upload no encontrado.');
                        return;
                    }

                    fetch(imageUrl)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`Error al cargar la imagen: ${response.statusText}`);
                            }
                            return response.blob();
                        })
                        .then(blob => {
                            const fileName = imageUrl.split('/').pop();
                            const file = new File([blob], fileName, { type: blob.type || 'image/png' });

                            // Para asignar archivos a un input type="file", se usa un objeto DataTransfer
                            const dataTransfer = new DataTransfer();
                            dataTransfer.items.add(file);
                            uploadInput.files = dataTransfer.files;

                            // Disparar el evento 'change' para que ai-canvas.js lo procese
                            uploadInput.dispatchEvent(new Event('change', { bubbles: true }));
                            console.log('Evento change disparado para la imagen del unicornio.');
                        })
                        .catch(error => {
                            console.error('Error al precargar la imagen del unicornio:', error);
                        });
                }, 1500); // Un poco más de tiempo para asegurar la inicialización completa
            } else {
                console.error('Es la web Provisional, No seas Tan cotilla o sí lo eres se paciente');
            }
        });
    </script>
</body>
</html>
